# Sanity build for QBSmarter on the GitHub mirror.
#
# This file is the GitHub-flavoured equivalent of
# .forgejo/workflows/build.yaml. The two workflows are intentionally
# kept in sync so that pushes mirrored from Codeberg produce the same
# build output on either forge.
#
# The canonical project home is https://codeberg.org/zucham/QBSmarter.
# Pull requests filed on the GitHub mirror cannot be merged. Please
# contribute via Codeberg.

name: Sanity build

on:
  push:
    branches:
      - main
  # Pull requests are not accepted on the mirror; the maintainer cannot
  # merge them. See .github/PULL_REQUEST_TEMPLATE.md. We still run a
  # build on incoming PRs, both as a courtesy and so the contributor
  # can confirm their change at least compiles before they re-file on
  # Codeberg.
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', '**/build.gradle.kts') }}
          restore-keys: gradle-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: QBSmarter-debug-${{ github.sha }}
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
