# Tag-triggered release build for QBSmarter on the GitHub mirror.
#
# This file is the GitHub-flavoured equivalent of
# .forgejo/workflows/release.yaml. Tags pushed to Codeberg are
# replicated to GitHub via the configured push mirror; this workflow
# notices the new tag here and produces an independent signed release
# APK that's attached to a GitHub Release.
#
# The canonical project home is https://codeberg.org/zucham/QBSmarter.
# Both forges produce APKs signed with the same release keystore, so an
# APK from either forge is interchangeable from Android's perspective:
# users can switch between Codeberg and GitHub downloads without
# uninstalling.
#
# Required secrets (set in GitHub repo Settings > Secrets and variables
# > Actions). These are the same four secrets you set on Codeberg:
#   KEYSTORE_BASE64
#   KEYSTORE_PASSWORD
#   KEY_ALIAS
#   KEY_PASSWORD

name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # softprops/action-gh-release needs write access to repo contents
      # to create the GitHub Release and upload assets.
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', '**/build.gradle.kts') }}
          restore-keys: gradle-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode keystore
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d \
            > "$RUNNER_TEMP/keystore/release.jks"
          echo "QBS_KEYSTORE_PATH=$RUNNER_TEMP/keystore/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          QBS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          QBS_KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          QBS_KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p release
          TAG="${GITHUB_REF_NAME}"
          cp androidApp/build/outputs/apk/release/*.apk \
            "release/QBSmarter-${TAG}.apk"
          ls -lh release/

      # Create or update the GitHub Release for this tag and attach the
      # APK. softprops/action-gh-release is the de-facto standard for
      # release publishing on GitHub Actions.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 'QBSmarter ${{ github.ref_name }}'
          files: release/*.apk
          # Release notes can be edited manually after the workflow
          # creates the release. The body below points users to the
          # canonical home so they don't think GitHub is the source.
          body: |
            QBSmarter ${{ github.ref_name }}.

            This release was built automatically from the canonical
            repository at https://codeberg.org/zucham/QBSmarter and
            mirrored here. Issues and pull requests should be filed on
            Codeberg, not on this GitHub mirror.

            See [CHANGELOG](https://codeberg.org/zucham/QBSmarter/releases)
            on Codeberg for details.
